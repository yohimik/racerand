name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if test -n "$unformatted"; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -count=1 -timeout 300s ./...
      - run: go test -race -count=1 -timeout 600s ./...
        if: matrix.os != 'windows-latest'
      - name: smoke benchmarks
        run: go test -run '^$' -bench 'BenchmarkUint64/math' -benchtime 50ms .
      - name: quick report
        run: go run ./cmd/racerand-bench -quick -out /dev/null -json /dev/null -noise ''
        if: matrix.os != 'windows-latest'
